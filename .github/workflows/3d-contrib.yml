name: Generate 3D Contribution Calendar

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D Contribution Graph
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: mustafamahmoud8
          SETTING_JSON: |
            {
              "githubUserName": "mustafamahmoud8",
              "type": "SkyLine",
              "backgroundColor": "#0d1117",
              "foregroundColor": "#58a6ff"
            }

      - name: Commit & Push
        run: |
          git config --global user.email "mustafaelzoghby7@gmail.com"
          git config --global user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || git commit -m "📊 Update 3D contribution graph [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}